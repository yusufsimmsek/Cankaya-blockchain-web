    <script>
      function googleTranslateElementInit() {
        // Initialize translator with default language Turkish
        new google.translate.TranslateElement({ pageLanguage: 'tr', autoDisplay: false }, 'google_translate_element');
      }

      // Helper: programmatically trigger Google Translate select if available
      function triggerTranslate(lang) {
        var target = (lang || 'tr').toLowerCase();
        var attempt = 0;
        var maxAttempts = 40; // ~4s
        var timer = setInterval(function() {
          attempt++;
          var combo = document.querySelector('.goog-te-combo');
          if (combo && combo.tagName === 'SELECT') {
            combo.value = target;
            var event = document.createEvent('HTMLEvents');
            event.initEvent('change', true, true);
            combo.dispatchEvent(event);
            clearInterval(timer);
          } else if (attempt >= maxAttempts) {
            clearInterval(timer);
          }
        }, 100);
      }

      // Expose a helper to switch language via cookies used by Google Translate
      window.setSiteLanguage = function(lang) {
        try {
          var from = 'tr';
          var to = (lang || 'tr').toLowerCase();

          // Clear cookie for resetting to TR
          var expirePast = 'Thu, 01 Jan 1970 00:00:00 UTC';
          var fullDomain = location.hostname;
          if (to === 'tr') {
            document.cookie = 'googtrans=; expires=' + expirePast + '; path=/;';
            document.cookie = 'googtrans=; expires=' + expirePast + '; domain=' + fullDomain + '; path=/;';
          } else {
            var cookieVal = '/' + from + '/' + to;
            var expireFuture = new Date();
            expireFuture.setFullYear(expireFuture.getFullYear() + 1);
            var expires = 'expires=' + expireFuture.toUTCString();
            document.cookie = 'googtrans=' + cookieVal + '; ' + expires + '; path=/;';
            document.cookie = 'googtrans=' + cookieVal + '; ' + expires + '; domain=' + fullDomain + '; path=/;';
          }
          // Try immediate translate without reload; fallback to reload
          triggerTranslate(to);
          setTimeout(function(){ if (to !== 'tr') { triggerTranslate(to); } }, 500);
          if (to === 'tr') { location.reload(); }
        } catch (e) {
          console.error('Dil değiştirilemedi', e);
        }
      }

      // Ensure banner stays hidden if Google tries to inject it later
      (function hideGTranslateBanner(){
        var hide = function(){
          var b = document.querySelector('.goog-te-banner-frame');
          if (b) { (b).style.display = 'none'; }
          document.body && (document.body.style.top = '0px');
        };
        document.addEventListener('DOMContentLoaded', hide);
        window.addEventListener('load', function(){ hide();
          // Auto-apply translation based on cookie without showing banner
          try {
            var match = (document.cookie.match(/(?:^|; )googtrans=([^;]+)/) || [])[1];
            if (match) {
              var parts = decodeURIComponent(match).split('/');
              var to = parts[2] || 'tr';
              if (to && to !== 'tr') { triggerTranslate(to); }
            }
          } catch(_) {}
        });
        setInterval(hide, 1500);
      })();
    </script>
